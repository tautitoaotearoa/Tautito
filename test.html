<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tautito Feed Test</title>
</head>
<body>

<h1>Tautito Feed Test</h1>
<p id="status">Testing connection...</p>

<script>
const csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSp-K7dEzkbFd8mCRpZt8v153iZ9snuVK-HP_d25ze-8MMWoDb8H-Z02ygoZhPGUjFCOfS6ipR-U10i/pub?output=csv";

fetch(csvUrl)
  .then(function(response) 
    if (!response.ok) 
      throw new Error("HTTP " + response.status);
    
    return response.text();
  )
  .then(function(data) 
    document.getElementById("status").textContent =
      "SUCCESS: Feed loaded. First 200 characters: " +
      data.substring(0, 200);
  )
  .catch(function(error) 
    document.getElementById("status").textContent =
      "FAILED: " + error.message;
  );
</script>

</body>
</html>
