<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Releases | Tautito</title><style>:root{--ink:#17211b;--green:#1f5b45;--cream:#f7f3e8}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--cream);color:var(--ink)}header{background:var(--green);padding:20px 5%}nav{max-width:1100px;margin:auto;display:flex;justify-content:space-between}.brand,.home{color:#fff;text-decoration:none}.brand{font-size:1.8rem;font-weight:700}main{max-width:1100px;margin:auto;padding:40px 5%}#search{width:100%;padding:12px;border-radius:8px;border:1px solid #ccc;margin-bottom:15px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px}.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.08)}.thumb{width:100%;height:260px;object-fit:cover;background:#ddd}.content{padding:18px}.artist{font-size:1.3rem;font-weight:700}.title{color:var(--green);font-weight:700}.meta{margin:10px 0;color:#444}.blurb{margin:12px 0}.buttons a{display:inline-block;margin-right:8px;margin-top:6px;padding:8px 12px;background:var(--green);color:#fff;text-decoration:none;border-radius:6px}</style></head><body><header><nav><a class="brand" href="index.html">Tautito</a><a class="home" href="index.html">Home</a></nav></header><main><h1>New Releases</h1><input id="search" placeholder="Search releases..."><p id="status">Loading releases...</p><div id="grid" class="grid"></div></main><script>
const CSV_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vSp-K7dEzkbFd8mCRpZt8v153iZ9snuVK-HP_d25ze-8MMWoDb8H-Z02ygoZhPGUjFCOfS6ipR-U10i/pub?output=csv';let releases=[];
function csv(t){const r=[];let row=[],f='',q=false;for(let i=0;i<t.length;i++){let c=t[i],n=t[i+1];if(c==='"'&&q&&n==='"'){f+='"';i++}else if(c==='"')q=!q;else if(c===','&&!q){row.push(f);f=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&n==='\n')i++;row.push(f);if(row.some(v=>v.trim()!==''))r.push(row);row=[];f=''}else f+=c}const h=r.shift();return r.map(v=>Object.fromEntries(h.map((x,i)=>[x,(v[i]||'').trim()]))) }
function fileId(u){const m=(u||'').match(/id=([^&]+)/);return m?m[1]:null}function thumb(u){const id=fileId(u);return id?`https://drive.google.com/thumbnail?id=${id}&sz=w1000`:''}function dateVal(v){const p=(v||'').split('/');if(p.length===3)return new Date(p[2],p[0]-1,p[1]);return new Date(v)}function fmt(v){const d=dateVal(v);return isNaN(d)?'':String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear()}
function render(){const q=document.getElementById('search').value.toLowerCase(),g=document.getElementById('grid'),items=releases.filter(r=>JSON.stringify(r).toLowerCase().includes(q));document.getElementById('status').textContent=items.length+' releases';g.innerHTML=items.map(r=>`<div class="card">${r['Album Image']?`<img class="thumb" src="${thumb(r['Album Image'])}">`:''}<div class="content"><div class="artist">${r['Artist']||''}</div><div class="title">${r['Album / track title']||''}</div><div class="meta">${r['Label']||''}<br>${fmt(r['Release date'])}</div><div class="blurb">${r['Album blurb']||''}</div><div class="buttons">${r['Listening / purchase link']?`<a target="_blank" href="${r['Listening / purchase link']}">Listen</a>`:''}${r['Electronic Press Kit / Press Release']?`<a target="_blank" href="${r['Electronic Press Kit / Press Release']}">EPK</a>`:''}</div></div></div>`).join('')}
fetch(CSV_URL).then(r=>r.text()).then(t=>{const cutoff=new Date();cutoff.setHours(0,0,0,0);cutoff.setDate(cutoff.getDate()-60);releases=csv(t).filter(r=>{const d=dateVal(r['Release date']);return(r['Submission type']||'').toLowerCase()==='new release'&&!isNaN(d)&&d>=cutoff}).sort((a,b)=>dateVal(a['Release date'])-dateVal(b['Release date']));render()});document.getElementById('search').addEventListener('input',render);
</script></body></html>
