<!DOCTYPE html>
<html lang="en-NZ">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#303b8f">
  <title>Gigs | Jazz Aotearoa</title>
  <style>
    :root {
      --ja-blue: #303b8f;
      --ja-blue-dark: #202965;
      --ja-teal: #52aaa6;
      --ja-ink: #171a25;
      --ja-muted: #626878;
      --ja-light: #f5f6fa;
      --ja-line: #dfe2eb;
      --ja-white: #ffffff;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: "Avenir Next", Avenir, Montserrat, "Segoe UI", Arial, Helvetica, sans-serif;
      color: var(--ja-ink);
      background: var(--ja-light);
      line-height: 1.5;
    }

    header {
      background: var(--ja-blue);
      color: var(--ja-white);
      padding: 30px 5%;
    }

    nav {
      max-width: 1100px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 32px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 17px;
      color: var(--ja-white);
      text-decoration: none;
      min-width: 0;
    }

    .brand-mark {
      position: relative;
      width: 70px;
      height: 48px;
      flex: 0 0 auto;
    }

    .brand-mark span {
      position: absolute;
      display: block;
      background: linear-gradient(145deg, var(--ja-teal), var(--ja-blue-dark));
      border-radius: 4px 17px 4px 17px;
      transform: skewY(31deg);
    }

    .brand-mark .mark-left {
      width: 30px;
      height: 26px;
      left: 0;
      top: 11px;
    }

    .brand-mark .mark-centre {
      width: 27px;
      height: 47px;
      left: 25px;
      top: 0;
      transform: skewY(31deg) rotate(180deg);
    }

    .brand-mark .mark-right {
      width: 30px;
      height: 26px;
      right: 0;
      top: 11px;
    }

    .brand-text {
      font-size: clamp(1.05rem, 2.5vw, 1.45rem);
      font-weight: 400;
      letter-spacing: .3em;
      line-height: 1.3;
      text-transform: uppercase;
    }

    .menu {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px 22px;
    }

    .menu a {
      color: var(--ja-white);
      text-decoration: none;
      font-size: .93rem;
      letter-spacing: .04em;
      border-bottom: 2px solid transparent;
      padding: 6px 0;
    }

    .menu a:hover,
    .menu a:focus-visible,
    .menu a[aria-current="page"] {
      border-bottom-color: var(--ja-teal);
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 52px 5% 76px;
    }

    h1 {
      margin: 0 0 8px;
      color: var(--ja-blue);
      font-size: clamp(2.5rem, 7vw, 4.8rem);
      font-weight: 500;
      letter-spacing: -.035em;
      line-height: 1.05;
    }

    .intro {
      max-width: 760px;
      color: var(--ja-muted);
      margin: 0 0 32px;
      font-size: 1.08rem;
    }

    .controls {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 14px;
      margin-bottom: 18px;
    }

    input,
    select {
      width: 100%;
      min-height: 50px;
      padding: 13px 15px;
      border: 1px solid var(--ja-line);
      border-radius: 4px;
      background: var(--ja-white);
      color: var(--ja-ink);
      font: inherit;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: var(--ja-teal);
      box-shadow: 0 0 0 3px rgba(82, 170, 166, .18);
    }

    .status {
      min-height: 24px;
      color: var(--ja-muted);
      margin-bottom: 18px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
      gap: 22px;
    }

    .card {
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--ja-white);
      border: 1px solid var(--ja-line);
      border-radius: 6px;
      padding: 25px;
      box-shadow: 0 6px 20px rgba(31, 40, 97, .07);
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 5px;
      background: linear-gradient(90deg, var(--ja-teal), var(--ja-blue));
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 11px 28px rgba(31, 40, 97, .12);
    }

    .card h2 {
      margin: 4px 0 9px;
      color: var(--ja-blue-dark);
      font-size: 1.38rem;
      line-height: 1.25;
    }

    .meta {
      margin: 5px 0;
      color: var(--ja-blue);
      font-weight: 700;
    }

    .venue { margin: 6px 0; }

    .blurb {
      margin: 16px 0 0;
      color: #353946;
    }

    .card-footer {
      margin-top: auto;
      padding-top: 17px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .fee {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      background: #e5f3f2;
      color: var(--ja-blue-dark);
      font-size: .92rem;
      font-weight: 700;
    }

    .link-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 16px;
      border-radius: 4px;
