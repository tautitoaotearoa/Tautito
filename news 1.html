<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>News | Tautito</title><style>:root{--ink:#17211b;--green:#1f5b45;--cream:#f7f3e8}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--cream);color:var(--ink)}header{background:var(--green);padding:20px 5%}nav{max-width:1100px;margin:auto;display:flex;justify-content:space-between}.brand,.home{color:#fff;text-decoration:none}.brand{font-size:1.8rem;font-weight:700}main{max-width:1100px;margin:auto;padding:40px 5%}#search{width:100%;padding:12px;border-radius:8px;border:1px solid #ccc;margin-bottom:15px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:20px}.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.08)}.thumb,.placeholder{width:100%;height:220px;object-fit:cover}.placeholder{display:flex;align-items:center;justify-content:center;background:#dad7cf;color:#555;font-weight:700}.content{padding:18px}.headline{font-size:1.4rem;font-weight:700;margin-bottom:12px}.date{color:#666;font-size:.95rem;margin-bottom:12px}.text{line-height:1.6}</style></head><body><header><nav><a class="brand" href="index.html">Tautito</a><a class="home" href="index.html">Home</a></nav></header><main><h1>News</h1><input id="search" placeholder="Search news..."><p id="status">Loading news...</p><div id="grid" class="grid"></div></main><script>
const CSV_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vSp-K7dEzkbFd8mCRpZt8v153iZ9snuVK-HP_d25ze-8MMWoDb8H-Z02ygoZhPGUjFCOfS6ipR-U10i/pub?output=csv';let news=[];
function csv(t){const r=[];let row=[],f='',q=false;for(let i=0;i<t.length;i++){let c=t[i],n=t[i+1];if(c==='"'&&q&&n==='"'){f+='"';i++}else if(c==='"')q=!q;else if(c===','&&!q){row.push(f);f=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&n==='\n')i++;row.push(f);if(row.some(v=>v.trim()!==''))r.push(row);row=[];f=''}else f+=c}const h=r.shift();return r.map(v=>Object.fromEntries(h.map((x,i)=>[x,(v[i]||'').trim()]))) }
function fileId(u){const m=(u||'').match(/id=([^&]+)/);return m?m[1]:null}function thumb(u){const id=fileId(u);return id?`https://drive.google.com/thumbnail?id=${id}&sz=w1000`:''}function ts(v){return new Date(v).getTime()||0}function fmt(v){const d=new Date(v);return isNaN(d)?'':String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear()}function imageBlock(u){const x=thumb(u);if(!x)return`<div class="placeholder">Tautito News</div>`;return`<img class="thumb" src="${x}" alt="News image" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';"><div class="placeholder" style="display:none">Tautito News</div>`}
function render(){const q=document.getElementById('search').value.toLowerCase(),items=news.filter(n=>JSON.stringify(n).toLowerCase().includes(q));document.getElementById('status').textContent=items.length+' news items';document.getElementById('grid').innerHTML=items.map(n=>`<div class="card">${imageBlock(n['News Image'])}<div class="content"><div class="headline">${n['Headline']||''}</div><div class="date">${fmt(n['Timestamp'])}</div><div class="text">${n['Text']||''}</div></div></div>`).join('')}
fetch(CSV_URL).then(r=>r.text()).then(t=>{const cutoff=new Date();cutoff.setHours(0,0,0,0);cutoff.setDate(cutoff.getDate()-60);news=csv(t).filter(r=>(r['Submission type']||'').toLowerCase()==='news'&&ts(r['Timestamp'])>=cutoff.getTime()).sort((a,b)=>ts(b['Timestamp'])-ts(a['Timestamp']));render()});document.getElementById('search').addEventListener('input',render);
</script></body></html>
