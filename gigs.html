<!DOCTYPE html>
<html lang="en-NZ">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#303b8f">
  <title>Gigs | Jazz Aotearoa</title>
  <style>
    :root {
      --ja-blue: #303b8f;
      --ja-blue-dark: #202965;
      --ja-teal: #52aaa6;
      --ja-ink: #171a25;
      --ja-muted: #626878;
      --ja-light: #f5f6fa;
      --ja-line: #dfe2eb;
      --ja-white: #ffffff;
    }

    * { box-sizing: border-box; }

    html { scroll-behaviour: smooth; }

    body {
      margin: 0;
      font-family: "Avenir Next", Avenir, Montserrat, "Segoe UI", Arial, Helvetica, sans-serif;
      color: var(--ja-ink);
      background: var(--ja-light);
      line-height: 1.5;
    }

    header {
      background: var(--ja-blue);
      color: var(--ja-white);
      padding: 30px 5%;
    }

    nav {
      max-width: 1100px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 32px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 17px;
      color: var(--ja-white);
      text-decoration: none;
      min-width: 0;
    }

    .brand-mark {
      position: relative;
      width: 70px;
      height: 48px;
      flex: 0 0 auto;
    }

    .brand-mark span {
      position: absolute;
      display: block;
      background: linear-gradient(145deg, var(--ja-teal), var(--ja-blue-dark));
      border-radius: 4px 17px 4px 17px;
      transform: skewY(31deg);
    }

    .brand-mark .mark-left {
      width: 30px;
      height: 26px;
      left: 0;
      top: 11px;
    }

    .brand-mark .mark-centre {
      width: 27px;
      height: 47px;
      left: 25px;
      top: 0;
      transform: skewY(31deg) rotate(180deg);
    }

    .brand-mark .mark-right {
      width: 30px;
      height: 26px;
      right: 0;
      top: 11px;
    }

    .brand-text {
      font-size: clamp(1.05rem, 2.5vw, 1.45rem);
      font-weight: 400;
      letter-spacing: .3em;
      line-height: 1.3;
      text-transform: uppercase;
    }

    .menu {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px 22px;
    }

    .menu a {
      color: var(--ja-white);
      text-decoration: none;
      font-size: .93rem;
      letter-spacing: .04em;
      border-bottom: 2px solid transparent;
      padding: 6px 0;
    }

    .menu a:hover,
    .menu a:focus-visible,
    .menu a[aria-current="page"] {
      border-bottom-color: var(--ja-teal);
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 52px 5% 76px;
    }

    h1 {
      margin: 0 0 8px;
      color: var(--ja-blue);
      font-size: clamp(2.5rem, 7vw, 4.8rem);
      font-weight: 500;
      letter-spacing: -.035em;
      line-height: 1.05;
    }

    .intro {
      max-width: 760px;
      color: var(--ja-muted);
      margin: 0 0 32px;
      font-size: 1.08rem;
    }

    .controls {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 14px;
      margin-bottom: 18px;
    }

    input,
    select {
      width: 100%;
      min-height: 50px;
      padding: 13px 15px;
      border: 1px solid var(--ja-line);
      border-radius: 4px;
      background: var(--ja-white);
      color: var(--ja-ink);
      font: inherit;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: var(--ja-teal);
      box-shadow: 0 0 0 3px rgba(82, 170, 166, .18);
    }

    .status {
      min-height: 24px;
      color: var(--ja-muted);
      margin-bottom: 18px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
      gap: 22px;
    }

    .card {
      position: relative;
      overflow: hidden;
      background: var(--ja-white);
      border: 1px solid var(--ja-line);
      border-radius: 6px;
      padding: 25px;
      box-shadow: 0 6px 20px rgba(31, 40, 97, .07);
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 5px;
      background: linear-gradient(90deg, var(--ja-teal), var(--ja-blue));
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 11px 28px rgba(31, 40, 97, .12);
    }

    .card h2 {
      margin: 4px 0 9px;
      color: var(--ja-blue-dark);
      font-size: 1.38rem;
      line-height: 1.25;
    }

    .meta {
      margin: 5px 0;
      color: var(--ja-blue);
      font-weight: 700;
    }

    .venue { margin: 6px 0; }

    .blurb {
      margin: 16px 0 0;
      color: #353946;
    }

    .fee {
      display: inline-block;
      margin-top: 17px;
      padding: 6px 10px;
      border-radius: 999px;
      background: #e5f3f2;
      color: var(--ja-blue-dark);
      font-size: .92rem;
      font-weight: 700;
    }

    .empty {
      grid-column: 1 / -1;
      padding: 25px;
      background: var(--ja-white);
      border: 1px solid var(--ja-line);
      border-radius: 6px;
    }

    footer {
      background: var(--ja-blue-dark);
      color: rgba(255, 255, 255, .82);
      padding: 28px 5%;
      text-align: center;
      font-size: .9rem;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    @media (max-width: 820px) {
      nav { align-items: flex-start; }
      .menu { max-width: 360px; }
    }

    @media (max-width: 680px) {
      header { padding-top: 23px; padding-bottom: 23px; }
      nav { flex-direction: column; }
      .menu { justify-content: flex-start; gap: 5px 18px; }
      .brand-mark { width: 58px; transform: scale(.83); transform-origin: left centre; margin-right: -7px; }
      .brand-text { letter-spacing: .22em; }
      .controls { grid-template-columns: 1fr; }
      main { padding-top: 39px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { scroll-behaviour: auto !important; }
      .card { transition: none; }
    }
  </style>
</head>
<body>
  <header>
    <nav aria-label="Main navigation">
      <a class="brand" href="index.html" aria-label="Jazz Aotearoa home">
        <span class="brand-mark" aria-hidden="true">
          <span class="mark-left"></span>
          <span class="mark-centre"></span>
          <span class="mark-right"></span>
        </span>
        <span class="brand-text">Jazz<br>Aotearoa</span>
      </a>

      <div class="menu">
        <a href="gigs.html" aria-current="page">Gigs</a>
        <a href="releases.html">Releases</a>
        <a href="news.html">News</a>
        <a href="reviews.html">Reviews</a>
        <a href="interviews.html">Interviews</a>
        <a href="throwbacks.html">Throwbacks</a>
      </div>
    </nav>
  </header>

  <main>
    <h1>Gigs</h1>
    <p class="intro">Jazz performances around Aotearoa. Search by artist, venue, town or description, and filter by date and region.</p>

    <section class="controls" aria-label="Gig filters">
      <input id="search" type="search" placeholder="Search gigs" aria-label="Search gigs">
      <input id="date-filter" type="date" aria-label="Filter from date">
      <select id="region" aria-label="Filter by region">
        <option value="">All regions</option>
      </select>
    </section>

    <div id="status" class="status">Loading gigs...</div>
    <section id="gig-grid" class="grid" aria-live="polite"></section>
  </main>

  <footer>Jazz Aotearoa</footer>

  <script>
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSp-K7dEzkbFd8mCRpZt8v153iZ9snuVK-HP_d25ze-8MMWoDb8H-Z02ygoZhPGUjFCOfS6ipR-U10i/pub?output=csv";
    let gigs = [];

    function parseCSV(text) {
      const rows = [];
      let row = [], field = "", quoted = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i], next = text[i + 1];
        if (c === '"' && quoted && next === '"') { field += '"'; i++; }
        else if (c === '"') { quoted = !quoted; }
        else if (c === ',' && !quoted) { row.push(field); field = ""; }
        else if ((c === '\n' || c === '\r') && !quoted) {
          if (c === '\r' && next === '\n') i++;
          row.push(field); field = "";
          if (row.some(value => value.trim() !== "")) rows.push(row);
          row = [];
        } else { field += c; }
      }
      if (field.length || row.length) { row.push(field); rows.push(row); }
      const headers = rows.shift().map(h => h.trim());
      return rows.map(values => Object.fromEntries(headers.map((h, i) => [h, (values[i] || "").trim()])));
    }

    function escapeHTML(value) {
      return String(value || "").replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','\'':'&#39;','"':'&quot;'}[char]));
    }

    function dateValue(value) {
      if (!value) return Number.MAX_SAFE_INTEGER;
      const parts = value.split('/');
      if (parts.length === 3) return new Date(Number(parts[2]), Number(parts[0]) - 1, Number(parts[1])).getTime();
      const date = new Date(value);
      return Number.isNaN(date.getTime()) ? Number.MAX_SAFE_INTEGER : date.getTime();
    }

    function formatDate(value) {
      const stamp = dateValue(value);
      if (stamp === Number.MAX_SAFE_INTEGER) return value || "Date to be confirmed";
      const d = new Date(stamp);
      return String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + d.getFullYear();
    }

    function render() {
      const query = document.getElementById('search').value.trim().toLowerCase();
      const region = document.getElementById('region').value;
      const dateFilterVal = document.getElementById('date-filter').value;

      let filterDateTimestamp = null;
      if (dateFilterVal) {
        const parts = dateFilterVal.split('-');
        filterDateTimestamp = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2])).getTime();
      }

      const matches = gigs.filter(gig => {
        const searchable = [gig['Artist / Ensemble name'], gig['Venue Name'], gig['Town / City'], gig['Gig blurb'], gig['Region']].join(' ').toLowerCase();
        const matchesQuery = !query || searchable.includes(query);
        const matchesRegion = !region || gig['Region'] === region;

        let matchesDate = true;
        if (filterDateTimestamp !== null) {
          const gigTime = dateValue(gig['Date']);
          matchesDate = gigTime >= filterDateTimestamp;
        }

        return matchesQuery && matchesRegion && matchesDate;
      });

      const grid = document.getElementById('gig-grid');
      document.getElementById('status').textContent = matches.length + (matches.length === 1 ? ' gig' : ' gigs');
      if (!matches.length) {
        grid.innerHTML = '<div class="empty">No gigs match those filters.</div>';
        return;
      }
      grid.innerHTML = matches.map(gig => `
        <article class="card">
          <h2>${escapeHTML(gig['Artist / Ensemble name'] || 'Artist to be announced')}</h2>
          <p class="meta">${escapeHTML(formatDate(gig['Date']))}${gig['Time'] ? ' at ' + escapeHTML(gig['Time'].substring(0, 5)) : ''}</p>
          <p class="venue">${escapeHTML(gig['Venue Name'] || 'Venue to be confirmed')}${gig['Town / City'] ? ', ' + escapeHTML(gig['Town / City']) : ''}</p>
          ${gig['Gig blurb'] ? `<p class="blurb">\${escapeHTML(gig['Gig blurb'])}</p>` : ''}
          ${gig['Entry fee'] ? `<span class="fee">\${escapeHTML(gig['Entry fee'])}</span>` : ''}
        </article>`).join('');
    }

    fetch(CSV_URL)
      .then(response => {
        if (!response.ok) throw new Error('HTTP ' + response.status);
        return response.text();
      })
      .then(text => {
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        gigs = parseCSV(text)
          .filter(row => {
            const isGig = (row['Submission type'] || row['Submission Type'] || '').toLowerCase() === 'gig listing';
            const gigDate = dateValue(row['Date']);
            return isGig && gigDate !== Number.MAX_SAFE_INTEGER && gigDate >= today.getTime();
          })
          .sort((a, b) => dateValue(a['Date']) - dateValue(b['Date']));
        const regions = [...new Set(gigs.map(g => g['Region']).filter(Boolean))].sort();
        const select = document.getElementById('region');
        regions.forEach(region => select.add(new Option(region, region)));
        render();
      })
      .catch(error => {
        document.getElementById('status').textContent = 'The gig listings could not be loaded.';
        document.getElementById('gig-grid').innerHTML = `<div class="empty">${escapeHTML(error.message)}</div>`;
      });

    document.getElementById('search').addEventListener('input', render);
    document.getElementById('date-filter').addEventListener('change', render);
    document.getElementById('region').addEventListener('change', render);
  </script>
</body>
</html>
