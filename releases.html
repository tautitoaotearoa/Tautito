<!DOCTYPE html>
<html lang="en-NZ">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#303b8f">
  <title>Releases | Jazz Aotearoa</title>
  <style>
    :root {
      --ja-blue: #303b8f;
      --ja-blue-dark: #202965;
      --ja-teal: #52aaa6;
      --ja-ink: #171a25;
      --ja-muted: #626878;
      --ja-light: #f5f6fa;
      --ja-line: #dfe2eb;
      --ja-white: #ffffff;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: "Avenir Next", Avenir, Montserrat, "Segoe UI", Arial, Helvetica, sans-serif;
      color: var(--ja-ink);
      background: var(--ja-light);
      line-height: 1.5;
    }

    header {
      background: var(--ja-blue);
      color: var(--ja-white);
      padding: 30px 5%;
    }

    nav {
      max-width: 1100px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 32px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 17px;
      color: var(--ja-white);
      text-decoration: none;
      min-width: 0;
    }

    .brand-mark {
      position: relative;
      width: 70px;
      height: 48px;
      flex: 0 0 auto;
    }

    .brand-mark span {
      position: absolute;
      display: block;
      background: linear-gradient(145deg, var(--ja-teal), var(--ja-blue-dark));
      border-radius: 4px 17px 4px 17px;
      transform: skewY(31deg);
    }

    .brand-mark .mark-left {
      width: 30px;
      height: 26px;
      left: 0;
      top: 11px;
    }

    .brand-mark .mark-centre {
      width: 27px;
      height: 47px;
      left: 25px;
      top: 0;
      transform: skewY(31deg) rotate(180deg);
    }

    .brand-mark .mark-right {
      width: 30px;
      height: 26px;
      right: 0;
      top: 11px;
    }

    .brand-text {
      font-size: clamp(1.05rem, 2.5vw, 1.45rem);
      font-weight: 400;
      letter-spacing: .3em;
      line-height: 1.3;
      text-transform: uppercase;
    }

    .menu {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px 22px;
    }

    .menu a {
      color: var(--ja-white);
      text-decoration: none;
      font-size: .93rem;
      letter-spacing: .04em;
      border-bottom: 2px solid transparent;
      padding: 6px 0;
    }

    .menu a:hover,
    .menu a:focus-visible,
    .menu a[aria-current="page"] {
      border-bottom-color: var(--ja-teal);
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 52px 5% 76px;
    }

    h1 {
      margin: 0 0 8px;
      color: var(--ja-blue);
      font-size: clamp(2.5rem, 7vw, 4.8rem);
      font-weight: 500;
      letter-spacing: -.035em;
      line-height: 1.05;
    }

    .intro {
      max-width: 760px;
      color: var(--ja-muted);
      margin: 0 0 32px;
      font-size: 1.08rem;
    }

    input {
      width: 100%;
      min-height: 50px;
      padding: 13px 15px;
      border: 1px solid var(--ja-line);
      border-radius: 4px;
      background: var(--ja-white);
      color: var(--ja-ink);
      font: inherit;
      outline: none;
      margin-bottom: 18px;
    }

    input:focus {
      border-color: var(--ja-teal);
      box-shadow: 0 0 0 3px rgba(82, 170, 166, .18);
    }

    .status {
      min-height: 24px;
      color: var(--ja-muted);
      margin-bottom: 18px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 22px;
    }

    .card {
      position: relative;
      overflow: hidden;
      background: var(--ja-white);
      border: 1px solid var(--ja-line);
      border-radius: 6px;
      box-shadow: 0 6px 20px rgba(31, 40, 97, .07);
      transition: transform .2s ease, box-shadow .2s ease;
      display: flex;
      flex-direction: column;
    }

    .card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 5px;
      background: linear-gradient(90deg, var(--ja-teal), var(--ja-blue));
      z-index: 2;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 11px 28px rgba(31, 40, 97, .12);
    }

    .thumb {
      width: 100%;
      height: 260px;
      object-fit: cover;
      background: var(--ja-line);
    }

    .content {
      padding: 22px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .artist {
      font-size: 1.38rem;
      font-weight: 700;
      color: var(--ja-blue-dark);
      margin: 0 0 4px;
      line-height: 1.25;
    }

    .title {
      color: var(--ja-blue);
      font-weight: 700;
      font-size: 1.05rem;
      margin-bottom: 8px;
    }

    .meta {
      margin: 5px 0 12px;
      color: var(--ja-muted);
      font-size: .92rem;
    }

    .blurb {
      margin: 0 0 16px;
      color: #353946;
      flex: 1;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: auto;
    }

    .buttons a {
      display: inline-block;
      padding: 6px 12px;
      background: #e5f3f2;
      color: var(--ja-blue-dark);
      text-decoration: none;
      border-radius: 999px;
      font-size: .92rem;
      font-weight: 700;
      transition: background .2s ease;
    }

    .buttons a:hover {
      background: var(--ja-teal);
      color: var(--ja-white);
    }

    .empty {
      grid-column: 1 / -1;
      padding: 25px;
      background: var(--ja-white);
      border: 1px solid var(--ja-line);
      border-radius: 6px;
      color: var(--ja-muted);
    }

    footer {
      background: var(--ja-blue-dark);
      color: rgba(255, 255, 255, .82);
      padding: 28px 5%;
      text-align: center;
      font-size: .9rem;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    @media (max-width: 820px) {
      nav { align-items: flex-start; }
      .menu { max-width: 360px; }
    }

    @media (max-width: 680px) {
      header { padding-top: 23px; padding-bottom: 23px; }
      nav { flex-direction: column; }
      .menu { justify-content: flex-start; gap: 5px 18px; }
      .brand-mark { width: 58px; transform: scale(.83); transform-origin: left centre; margin-right: -7px; }
      .brand-text { letter-spacing: .22em; }
      main { padding-top: 39px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { scroll-behavior: auto !important; }
      .card { transition: none; }
    }
  </style>
</head>
<body>
  <header>
    <nav aria-label="Main navigation">
      <a class="brand" href="index.html" aria-label="Jazz Aotearoa home">
        <span class="brand-mark" aria-hidden="true">
          <span class="mark-left"></span>
          <span class="mark-centre"></span>
          <span class="mark-right"></span>
        </span>
        <span class="brand-text">Jazz<br>Aotearoa</span>
      </a>

      <div class="menu">
        <a href="gigs.html">Gigs</a>
        <a href="releases.html" aria-current="page">Releases</a>
        <a href="news.html">News</a>
        <a href="reviews.html">Reviews</a>
        <a href="interviews.html">Interviews</a>
        <a href="throwbacks.html">Throwbacks</a>
      </div>
    </nav>
  </header>

  <main>
    <h1>New Releases</h1>
    <p class="intro">Discover the latest jazz albums and singles released across Aotearoa.</p>
    <input id="search" type="search" placeholder="Search releases..." aria-label="Search releases">
    <div id="status" class="status">Loading releases...</div>
    <div id="grid" class="grid" aria-live="polite"></div>
  </main>

  <footer>Jazz Aotearoa</footer>

  <script>
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSp-K7dEzkbFd8mCRpZt8v153iZ9snuVK-HP_d25ze-8MMWoDb8H-Z02ygoZhPGUjFCOfS6ipR-U10i/pub?output=csv';
    let releases = [];

    function csv(t) {
      const r = [];
      let row = [], f = '', q = false;
      for (let i = 0; i < t.length; i++) {
        let c = t[i], n = t[i + 1];
        if (c === '"' && q && n === '"') { f += '"'; i++; }
        else if (c === '"') { q = !q; }
        else if (c === ',' && !q) { row.push(f); f = ''; }
        else if ((c === '\n' || c === '\r') && !q) {
          if (c === '\r' && n === '\n') i++;
          row.push(f);
          if (row.some(v => v.trim() !== '')) r.push(row);
          row = []; f = '';
        } else { f += c; }
      }
      if (f.length || row.length) { row.push(f); r.push(row); }
      const h = r.shift().map(h => h.trim());
      return r.map(v => Object.fromEntries(h.map((x, i) => [x, (v[i] || '').trim()])));
    }

    function fileId(u) {
      const m = (u || '').match(/id=([^&]+)/);
      return m ? m[1] : null;
    }

    function thumb(u) {
      const id = fileId(u);
      return id ? 'https://drive.google.com/thumbnail?id=' + id + '&sz=w1000' : '';
    }

    function dateVal(v) {
      if (!v) return Number.MAX_SAFE_INTEGER;
      const p = v.split('/');
      if (p.length === 3) {
        const d = new Date(Number(p[2]), Number(p[0]) - 1, Number(p[1]));
        return isNaN(d.getTime()) ? Number.MAX_SAFE_INTEGER : d.getTime();
      }
      const d = new Date(v);
      return isNaN(d.getTime()) ? Number.MAX_SAFE_INTEGER : d.getTime();
    }

    function fmt(v) {
      const stamp = dateVal(v);
      if (stamp === Number.MAX_SAFE_INTEGER) return v || '';
      const d = new Date(stamp);
      return String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + d.getFullYear();
    }

    function escapeHTML(value) {
      return String(value || "").replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
    }

    function render() {
      const q = document.getElementById('search').value.toLowerCase().trim();
      const gridElem = document.getElementById('grid');
      const items = releases.filter(r => JSON.stringify(r).toLowerCase().includes(q));
      
      document.getElementById('status').textContent = items.length + (items.length === 1 ? ' release' : ' releases');
      
      if (!items.length) {
        gridElem.innerHTML = '<div class="empty">No releases match your search.</div>';
        return;
      }

      gridElem.innerHTML = items.map(r => {
        const imgTag = r['Album Image'] ? '<img class="thumb" src="' + escapeHTML(thumb(r['Album Image'])) + '" alt="' + escapeHTML(r['Album / track title'] || 'Album cover') + '">' : '';
        const artist = escapeHTML(r['Artist'] || 'Artist Name');
        const title = escapeHTML(r['Album / track title'] || 'Untitled');
        const label = escapeHTML(r['Label'] || '');
        const dateStr = escapeHTML(fmt(r['Release date']));
        const metaSep = (r['Label'] && r['Release date']) ? ' • ' : '';
        const blurbText = r['Album blurb'] ? '<p class="blurb">' + escapeHTML(r['Album blurb']) + '</p>' : '';
        
        let buttonsHtml = '';
        if (r['Listening / purchase link']) {
          buttonsHtml += '<a target="_blank" rel="noopener" href="' + escapeHTML(r['Listening / purchase link']) + '">Listen</a>';
        }
        if (r['Electronic Press Kit / Press Release']) {
          buttonsHtml += '<a target="_blank" rel="noopener" href="' + escapeHTML(r['Electronic Press Kit / Press Release']) + '">EPK</a>';
        }
        const buttonsContainer = buttonsHtml ? '<div class="buttons">' + buttonsHtml + '</div>' : '';

        return '<article class="card">' +
          imgTag +
          '<div class="content">' +
            '<h2 class="artist">' + artist + '</h2>' +
            '<div class="title">' + title + '</div>' +
            '<div class="meta">' + label + metaSep + dateStr + '</div>' +
            blurbText +
            buttonsContainer +
          '</div>' +
        '</article>';
      }).join('');
    }

    fetch(CSV_URL)
      .then(response => {
        if (!response.ok) throw new Error('HTTP ' + response.status);
        return response.text();
      })
      .then(text => {
        const cutoff = new Date();
        cutoff.setHours(0, 0, 0, 0);
        cutoff.setDate(cutoff.getDate() - 60);
        releases = csv(text).filter(r => {
          const isRelease = (r['Submission type'] || '').toLowerCase() === 'new release';
          const dVal = dateVal(r['Release date']);
          return isRelease && dVal !== Number.MAX_SAFE_INTEGER && dVal >= cutoff.getTime();
        }).sort((a, b) => dateVal(b['Release date']) - dateVal(a['Release date']));
        render();
      })
      .catch(error => {
        document.getElementById('status').textContent = 'Releases could not be loaded.';
        document.getElementById('grid').innerHTML = '<div class="empty">' + escapeHTML(error.message) + '</div>';
      });

    document.getElementById('search').addEventListener('input', render);
  </script>
</body>
</html>
